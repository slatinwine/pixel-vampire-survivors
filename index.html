/* ================= 音效（WebAudio 芯片音） ================= */
let AC=null, masterG=null;
let muted = false;
try{ muted = localStorage.getItem('pxvs_mute')==='1'; }catch(e){}
function initAudio(){
  if(AC) { if(AC.state==='suspended') AC.resume(); return; }
  try{
    AC = new (window.AudioContext||window.webkitAudioContext)();
    masterG = AC.createGain(); masterG.gain.value = 0.16; masterG.connect(AC.destination);
  }catch(e){}
}
function tone(f0,f1,dur,type,vol,delay){
  if(!AC||muted) return;
  const t = AC.currentTime + (delay||0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type||'square';
  o.frequency.setValueAtTime(Math.max(1,f0), t);
  o.frequency.exponentialRampToValueAtTime(Math.max(1,f1), t+dur);
  g.gain.setValueAtTime(vol||0.3, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  o.connect(g); g.connect(masterG);
  o.start(t); o.stop(t+dur+0.03);
}
const lastSfx = {};
function sfx(name){
  const now = performance.now();
  if(lastSfx[name] && now-lastSfx[name] < 45) return;
  lastSfx[name] = now;
  switch(name){
    case 'shoot': tone(950,480,0.06,'square',0.20); break;
    case 'hit':   tone(230,130,0.045,'square',0.25); break;
    case 'kill':  tone(170,40,0.11,'sawtooth',0.30); break;
    case 'gem':   tone(1150,1750,0.05,'square',0.16); break;
    case 'hurt':  tone(150,55,0.24,'sawtooth',0.5); break;
    case 'level': [660,880,1108,1318].forEach((f,i)=>tone(f,f,0.09,'square',0.26,i*0.07)); break;
    case 'chest': [523,659,784,1046].forEach((f,i)=>tone(f,f,0.1,'square',0.26,i*0.08)); break;
    case 'boss':  tone(85,45,0.6,'sawtooth',0.55); break;
    case 'sel':   tone(720,980,0.05,'square',0.22); break;

  'l':'#8fd05a','L':'#5e9440','u':'#1d1830','d':'#332a4d'
};
function buildSprite(rows){
  let w=0; for(const r of rows) w=Math.max(w,r.length);
  const h=rows.length;
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d');
  for(let y=0;y<h;y++)for(let x=0;x<rows[y].length;x++){
    const col=PAL[rows[y][x]];
    if(col){ g.fillStyle=col; g.fillRect(x,y,1,1); }
  }
  const f=document.createElement('canvas'); f.width=w; f.height=h;
  const gf=f.getContext('2d'); gf.translate(w,0); gf.scale(-1,1); gf.drawImage(c,0,0);
  const white = src=>{
    const c2=document.createElement('canvas'); c2.width=src.width; c2.height=src.height;
    const g2=c2.getContext('2d'); g2.drawImage(src,0,0);
    g2.globalCompositeOperation='source-in'; g2.fillStyle='#ffffff';
    g2.fillRect(0,0,c2.width,c2.height); return c2;
  };
  return {c,f,w,h,wc:white(c),wf:white(f)};
}

function drawSpr(s, x, y, opt){
  opt = opt||{};
  const img = opt.white ? (opt.flip?s.wf:s.wc) : (opt.flip?s.f:s.c);
  if(opt.alpha!==undefined) ctx.globalAlpha = opt.alpha;
  const dx = Math.round(x - s.w/2), dy = Math.round(y - s.h/2);
  if(opt.angle){
    ctx.save();
    ctx.translate(Math.round(x), Math.round(y));
    ctx.rotate(opt.angle);
    ctx.drawImage(img, -Math.ceil(s.w/2), -Math.ceil(s.h/2));
    ctx.restore();
  }else{
    ctx.drawImage(img, dx, dy);
  }
  if(opt.alpha!==undefined) ctx.globalAlpha = 1;
}

const TILE = 120;
let bgTile = null;
function buildBg(){
  bgTile = document.createElement('canvas'); bgTile.width=TILE; bgTile.height=TILE;
  const g = bgTile.getContext('2d');
  g.fillStyle='#161f2b'; g.fillRect(0,0,TILE,TILE);
  for(let i=0;i<260;i++){
    g.fillStyle = Math.random()<0.5 ? '#1a2532' : '#131b25';
    g.fillRect(randi(0,TILE-2), randi(0,TILE-2), randi(1,3), randi(1,3));
  }
  // 暗格
  g.fillStyle='rgba(0,0,0,0.10)';
  for(let i=0;i<TILE;i+=30) { g.fillRect(0,i,TILE,1); g.fillRect(i,0,1,TILE); }
  // 草丛
  for(let i=0;i<26;i++){
    const x=randi(2,TILE-4), y=randi(2,TILE-3);
    g.fillStyle='#24463c';
    g.fillRect(x,y,1,2); g.fillRect(x+2,y-1,1,3); g.fillRect(x+4,y,1,2);
  }
  // 骨头 / 石头 / 蘑菇
  for(let i=0;i<7;i++){
    const x=randi(3,TILE-8), y=randi(3,TILE-6);
    if(Math.random()<0.5){ // 石头
      g.fillStyle='#2c3a4d'; g.fillRect(x,y+1,4,2); g.fillRect(x+1,y,2,1);
      g.fillStyle='#3c4f66'; g.fillRect(x+1,y+1,1,1);
    }else if(Math.random()<0.5){ // 骨头
      g.fillStyle='#5a6270'; g.fillRect(x,y+1,4,1); g.fillRect(x-1,y,1,1); g.fillRect(x+4,y,1,1);

    }
  }
}

}

/* ================= 文本 ================= */
function txt(s, x, y, opt){
  opt = opt||{};
  const size = opt.size||8, align = opt.align||'left';
  ctx.font = (opt.bold?'bold ':'') + size + 'px "Courier New",monospace';
  ctx.textAlign = align; ctx.textBaseline = 'top';
  if(opt.shadow!==false){
    ctx.fillStyle = opt.shadow||'#000';
    ctx.fillText(s, Math.round(x)+1, Math.round(y)+1);
  }
  ctx.fillStyle = opt.color||'#fff';
  ctx.fillText(s, Math.round(x), Math.round(y));
}
function wrap(s, maxW, size){
  ctx.font = size + 'px "Courier New",monospace';
  const lines=[]; let cur='';
  for(const ch of s){
    if(ctx.measureText(cur+ch).width > maxW && cur){ lines.push(cur); cur=ch; }
    else cur+=ch;
  }
  if(cur) lines.push(cur);
  return lines;
}

let time=0, kills=0, shake=0, hurtT=0, pendingLv=0, endless=false, menuT=0, overT=0;
let enemies=[], bullets=[], gems=[], pickups=[], parts=[], floats=[], fxs=[];
let choices=[], selIdx=0, uiBtns=[];
let spawnT=1, ringI=0, bossI=0, endNext=0, eid=1;
let camX=0, camY=0;
let best={time:0,kills:0};
try{ const b=JSON.parse(localStorage.getItem('pxvs_best')||'null'); if(b) best=b; }catch(e){}

const player = {
  x:0,y:0,r:4,hp:120,maxHp:120,level:1,xp:0,next:5,invuln:0,
  face:1,animT:0,animF:0,spd:72,dmgMul:1,cdMul:1,armor:0,pickupR:30,
  weapons:[],passives:{}
};

function recompute(){
  const pv = k => player.passives[k]||0;
  player.dmgMul  = 1 + 0.12*pv('power');
  player.cdMul   = Math.max(0.4, 1 - 0.07*pv('cdr'));
  player.spd     = 72 * (1 + 0.08*pv('speed'));
  player.pickupR = 30 * (1 + 0.30*pv('magnet'));
  const nm = 120 + 25*pv('hp');
  if(nm > player.maxHp) player.hp += nm - player.maxHp;
  player.maxHp = nm;
  player.armor = pv('armor');
  player.hp = Math.min(player.hp, player.maxHp);
}

function resetGame(){
  time=0;kills=0;shake=0;hurtT=0;pendingLv=0;endless=false;overT=0;
  enemies=[];bullets=[];gems=[];pickups=[];parts=[];floats=[];fxs=[];
  spawnT=1;ringI=0;bossI=0;endNext=0;
  Object.assign(player,{x:0,y:0,hp:120,maxHp:120,level:1,xp:0,next:5,invuln:0,
    face:1,animT:0,animF:0,spd:72,dmgMul:1,cdMul:1,armor:0,pickupR:30,passives:{}});
  player.weapons=[{key:'wand',lvl:1,timer:0.4,burst:0,bt:0,active:false,at:0,ang:0}];
}
function saveBest(){
  if(time>best.time || kills>best.kills){
    best.time=Math.max(best.time,Math.floor(time)); best.kills=Math.max(best.kills,kills);
    try{ localStorage.setItem('pxvs_best', JSON.stringify(best)); }catch(e){}
  }
}

/* ================= 敌人 ================= */
function hpScale(){ const m=time/60; return 1 + m*0.30 + Math.pow(Math.max(0,m-15),1.3)*0.4; }
function dmgScale(){ return 1 + (time/60)*0.05; }

function makeEnemy(type,x,y){
  const b = ETYPES[type];
  enemies.push({
    type, id:eid++, x, y, r:b.r, spr:b.spr, anim:b.anim||0.25,
    hp:b.hp*hpScale()*(b.boss?1:1), maxHp:b.hp*hpScale(),
    spd:rand(b.spd[0],b.spd[1]), dmg:b.dmg*dmgScale(),
    xp:b.xp, col:b.col, boss:!!b.boss, ghost:!!b.ghost,
    kx:0, ky:0, flash:0, seed:Math.random()*10, animT:Math.random(), animF:0,
    orbCd:0, dead:false
  });
}
function spawnAtEdge(type){
  const a = Math.random()*Math.PI*2, r = 300+randi(0,40);
  makeEnemy(type, player.x+Math.cos(a)*r, player.y+Math.sin(a)*r);
}
function pickType(m){
  const w=[['bat',3],['zombie',2.2]];
  if(m>=1)   w.push(['skeleton',2.2]);
  if(m>=2.5) w.push(['ghost',1.6]);
  if(m>=4)   w.push(['brute',0.35+m*0.07]);
  let tot=0; for(const e of w) tot+=e[1];
  let x=Math.random()*tot;
  for(const e of w){ x-=e[1]; if(x<=0) return e[0]; }
  return 'bat';
}
function director(dt){
  const m = time/60;
  spawnT -= dt;
  if(spawnT<=0){
    spawnT = Math.max(0.3, 1.15 - m*0.07);
    const n = Math.min(9, 1 + Math.floor(m*0.5) + randi(0,2));
    for(let i=0;i<n;i++){ if(enemies.length<380) spawnAtEdge(pickType(m)); }
  }
  if(ringI<RINGS.length && time>=RINGS[ringI]){
    ringI++;
    for(let i=0;i<26;i++){
      const a=i/26*Math.PI*2;
      makeEnemy('bat', player.x+Math.cos(a)*300, player.y+Math.sin(a)*300);
    }
    announce('尸 潮 来 袭 !','#ff6b7a');
    sfx('boss');
  }
  if(bossI<BOSSES.length && time>=BOSSES[bossI]){
    bossI++;
    const a=Math.random()*Math.PI*2;
    makeEnemy('reaper', player.x+Math.cos(a)*320, player.y+Math.sin(a)*320);
    announce('死 亡 收 割 者 出 现 !','#e04545');
    sfx('boss');
  }
  if(endless && time>=endNext){
    endNext = time + 40;
    for(let i=0;i<2;i++){ const a=Math.random()*Math.PI*2; makeEnemy('reaper', player.x+Math.cos(a)*330, player.y+Math.sin(a)*330); }
    announce('收割者成群出没…','#e04545');
  }
}
function announce(s,color){ floats.push({x:player.x, y:player.y-46, vy:-6, life:2.6, text:s, color:color||'#fff', size:12, big:true}); }

function killEnemy(e){
  e.dead=true; kills++;
  dropGems(e.x,e.y,e.xp);
  if(e.boss){ pickups.push({kind:'chest',x:e.x,y:e.y}); shake=Math.max(shake,5); }
  else{
    if(Math.random()<0.012) pickups.push({kind:'chicken',x:e.x,y:e.y});
    else if(Math.random()<0.006) pickups.push({kind:'magnet',x:e.x,y:e.y});
  }
  for(let i=0;i<6;i++) parts.push({x:e.x,y:e.y,vx:rand(-50,50),vy:rand(-60,20),life:rand(0.25,0.5),color:e.col,size:randi(1,2)});
  sfx('kill');
}
function dropGems(x,y,v){
  while(v>=8){ gems.push(mkGem(x+rand(-4,4),y+rand(-4,4),8)); v-=8; }
  while(v>=3){ gems.push(mkGem(x+rand(-4,4),y+rand(-4,4),3)); v-=3; }
  while(v>=1){ gems.push(mkGem(x+rand(-3,3),y+rand(-3,3),1)); v-=1; }
  if(gems.length>260){ // 合并旧宝石防爆炸
    let sum=0; const old=gems.splice(0,40);
    for(const g of old) sum+=g.v;
    gems.unshift(mkGem(x,y,sum));
  }
}
function mkGem(x,y,v){ return {x,y,v,pull:false,t:Math.random()*6}; }

/* ================= 武器开火 ================= */
function nearestEnemy(x,y,maxD){
  let bd=maxD?maxD*maxD:Infinity, best=null;
  for(const e of enemies){
    if(e.dead) continue;
    const d=dist2(x,y,e.x,e.y);
    if(d<bd){bd=d;best=e;}
  }
  return best;
}
function farthestEnemy(){
  let bd=-1,best=null;
  for(const e of enemies){ if(e.dead)continue; const d=dist2(player.x,player.y,e.x,e.y); if(d>bd&&d<260*260){bd=d;best=e;} }
  return best||pick(enemies);
}
function fireWand(st){
  const t = nearestEnemy(player.x,player.y,270);
  if(!t) return;
  const a = Math.atan2(t.y-player.y, t.x-player.x);
  bullets.push({kind:'wand',x:player.x,y:player.y-4,vx:Math.cos(a)*st.spd,vy:Math.sin(a)*st.spd,
    r:3,dmg:st.dmg,pierce:1,life:1.6,hit:new Set(),ang:a});
  sfx('shoot');
}
function fireAxe(st){
  bullets.push({kind:'axe',x:player.x,y:player.y-6,vx:rand(-1,1)<0?rand(-110,-40):rand(40,110),
    vy:-235,r:5,dmg:st.dmg,pierce:9999,life:1.7,hit:new Set(),spin:0});
  sfx('shoot');
}
function fireCross(st){
  const t = farthestEnemy(); if(!t) return;
  const a = Math.atan2(t.y-player.y,t.x-player.x);
  bullets.push({kind:'cross',x:player.x,y:player.y-4,vx:Math.cos(a)*st.spd,vy:Math.sin(a)*st.spd,
    r:4,dmg:st.dmg,pierce:9999,life:3.2,hit:new Set(),spin:0,phase:0,pt:0.5});
  sfx('shoot');
}
function fireWhip(st){
  const hitSide = dir=>{
    fxs.push({type:'slash',x:player.x+dir*st.range/2,y:player.y-4,w:st.range,h:24,life:0.14,max:0.14,dir});
    for(const e of enemies){
      if(e.dead) continue;
      const dx=(e.x-player.x)*dir;
      if(dx>-4 && dx<st.range+e.r && Math.abs(e.y-player.y)<14+e.r)
        hitEnemy(e, st.dmg*player.dmgMul, dir*90, -20);
    }
  };
  hitSide(player.face);
  if(st.count>=2) setTimeout(()=>{},0); // 占位：双侧在同一帧依次结算
  if(st.count>=2) hitSide(-player.face);
}

/* ================= 伤害与升级 ================= */
function hitEnemy(e,dmg,kx,ky){
  if(e.dead) return;
  e.hp-=dmg; e.flash=0.09;
  const kb = e.boss?0.15:1;
  e.kx += (kx||0)*kb; e.ky += (ky||0)*kb;
  addFloat(e.x, e.y-e.half-3, String(Math.round(dmg)), '#fff', 7);
  sfx('hit');
  if(e.hp<=0) killEnemy(e);
}
// half 高度缓存
function sprHalf(){
  for(const e of enemies) e.half = (SPR[e.spr]?SPR[e.spr].h:8)/2;
}
function addFloat(x,y,text,color,size){
  if(floats.length>90) floats.shift();
  floats.push({x,y,vy:-20,life:0.55,text,color:color||'#fff',size:size||7});
}
function gainXP(v){
  player.xp+=v;
  while(player.xp>=player.next){
    player.xp-=player.next; player.level++; pendingLv++;
    player.next = nextXP(player.level);
    for(let i=0;i<10;i++) parts.push({x:player.x,y:player.y,vx:rand(-70,70),vy:rand(-80,10),life:rand(0.3,0.6),color:'#f2c14e',size:2});
  }
  sfx('gem');
}
function nextXP(lv){ return Math.floor(5 + (lv-1)*2.6 + Math.pow(lv,1.8)*0.9); }

function buildChoices(){
  const pool=[];
  for(const k in WEAPONS){
    const w = player.weapons.find(w=>w.key===k);
    if(w){ if(w.lvl<WEAPONS[k].max) pool.push({type:'w',key:k,lvl:w.lvl}); }
    else pool.push({type:'w',key:k,lvl:0});
  }
  for(const k in PASSIVES){
    const l = player.passives[k]||0;
    if(l<PASSIVES[k].max) pool.push({type:'p',key:k,lvl:l});
  }
  for(let i=pool.length-1;i>0;i--){ const j=randi(0,i); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  const out=pool.slice(0,3);
  while(out.length<3) out.push({type:'heal'});
  return out;
}
function openLevelUp(){
  choices=buildChoices(); selIdx=0; state='levelup'; sfx('level');
}
function choiceMeta(c){
  if(c.type==='w') return {name:WEAPONS[c.key].name, icon:WEAPONS[c.key].icon,
    lv:c.lvl===0?'新武器!':`Lv ${c.lvl} → ${c.lvl+1}`, desc:WEAPONS[c.key].tip(c.lvl+1)};
  if(c.type==='p') return {name:PASSIVES[c.key].name, icon:PASSIVES[c.key].icon,
    lv:`Lv ${c.lvl} → ${c.lvl+1}`, desc:PASSIVES[c.key].desc};
  return {name:'烤鸡大餐', icon:'chicken', lv:'恢复', desc:'回复 50 点生命'};
}
function applyChoice(i){
  const c=choices[i]; if(!c) return;
  sfx('sel');
  if(c.type==='w'){
    const w=player.weapons.find(w=>w.key===c.key);
    if(w) w.lvl++; else player.weapons.push({key:c.key,lvl:1,timer:0.4,burst:0,bt:0,active:false,at:0,ang:0});
    addFloat(player.x,player.y-14,WEAPONS[c.key].name+'!','#f2c14e',9);
  }else if(c.type==='p'){
    player.passives[c.key]=(player.passives[c.key]||0)+1;
    recompute();
    addFloat(player.x,player.y-14,PASSIVES[c.key].name+'!','#6fe3ff',9);
  }else{
    player.hp=Math.min(player.maxHp,player.hp+50); sfx('heal');
    addFloat(player.x,player.y-14,'+50','#4dbf6b',9);
  }
  pendingLv--;
  if(pendingLv>0){ choices=buildChoices(); selIdx=0; }
  else state='play';
}

/* ================= 更新 ================= */
const keys={};
let moveTarget=null;

function updatePlayer(dt){
  let dx=0,dy=0;
  if(keys['KeyA']||keys['ArrowLeft'])dx-=1;
  if(keys['KeyD']||keys['ArrowRight'])dx+=1;
  if(keys['KeyW']||keys['ArrowUp'])dy-=1;
  if(keys['KeyS']||keys['ArrowDown'])dy+=1;
  if(!dx&&!dy&&moveTarget){
    const tx=moveTarget.x-player.x, ty=moveTarget.y-player.y;
    if(tx*tx+ty*ty>36){ const d=Math.sqrt(tx*tx+ty*ty); dx=tx/d; dy=ty/d; }
  }
  if(dx||dy){
    const d=Math.sqrt(dx*dx+dy*dy);
    player.x+=dx/d*player.spd*dt; player.y+=dy/d*player.spd*dt;
    if(dx) player.face = dx>0?1:-1;
    player.animT+=dt;
    if(player.animT>0.14){player.animT=0;player.animF^=1;}
  }
  player.invuln-=dt;
  sprHalf();
}

function updateWeapons(dt){
  for(const w of player.weapons){
    const D=WEAPONS[w.key], st=D.st(w.lvl);
    if(D.mode==='aura'){
      w.timer-=dt;
      if(w.timer<=0){
        w.timer=st.cd;
        const r2=(st.rad+4)*(st.rad+4);
        for(const e of enemies){
          if(e.dead) continue;
          if(dist2(player.x,player.y,e.x,e.y)<r2)
            hitEnemy(e, st.dmg*player.dmgMul, (e.x-player.x)*2, (e.y-player.y)*2);
        }
      }
    }else if(D.mode==='orbit'){
      if(!w.active){
        w.timer-=dt;
        if(w.timer<=0&&enemies.length){ w.active=true; w.at=st.dur; w.ang=0; }
      }else{
        w.at-=dt; w.ang+=st.rot*dt;
        for(let i=0;i<st.count;i++){
          const a=w.ang+i*Math.PI*2/st.count;
          const ox=player.x+Math.cos(a)*30, oy=player.y+Math.sin(a)*30;
          for(const e of enemies){
            if(e.dead||e.orbCd>0) continue;
            if(dist2(ox,oy,e.x,e.y)<(4+e.r)*(4+e.r)){
              e.orbCd=0.4;
              hitEnemy(e, st.dmg*player.dmgMul, (e.x-player.x)*4, (e.y-player.y)*4);
            }
          }
        }
        if(w.at<=0){ w.active=false; w.timer=st.cd*player.cdMul; }
      }
    }else{
      if(w.burst>0){
        w.bt-=dt;
        if(w.bt<=0){ w.bt=0.09; w.burst--; D.fire(w,st); }
      }
      w.timer-=dt;
      if(w.timer<=0 && enemies.length){
        w.timer=st.cd*player.cdMul;
        w.burst=st.count; w.bt=0;
      }
    }
  }
}

function updateBullets(dt){
  for(const b of bullets){
    if(b.kind==='wand'){
      const t=nearestEnemy(b.x,b.y,140);
      if(t){
        const ta=Math.atan2(t.y-b.y,t.x-b.x);
        let ca=Math.atan2(b.vy,b.vx);
        let d=ta-ca; while(d>Math.PI)d-=Math.PI*2; while(d<-Math.PI)d+=Math.PI*2;
        ca+=clamp(d,-5*dt,5*dt);
        const sp=Math.sqrt(b.vx*b.vx+b.vy*b.vy);
        b.vx=Math.cos(ca)*sp; b.vy=Math.sin(ca)*sp; b.ang=ca;
      }
    }else if(b.kind==='axe'){
      b.vy+=520*dt; b.spin+=9*dt;
    }else if(b.kind==='cross'){
      if(b.phase===0){ b.vx*=Math.pow(0.2,dt); b.vy*=Math.pow(0.2,dt); b.pt-=dt; if(b.pt<=0)b.phase=1; }
      else{
        const a=Math.atan2(player.y-b.y,player.x-b.x);
        b.vx+=Math.cos(a)*700*dt; b.vy+=Math.sin(a)*700*dt;
        const sp=Math.sqrt(b.vx*b.vx+b.vy*b.vy);
        if(sp>260){b.vx*=260/sp;b.vy*=260/sp;}
        if(dist2(b.x,b.y,player.x,player.y)<64 && b.life<2.6) b.life=0;
      }
      b.spin+=10*dt;
    }
    b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt;
    for(const e of enemies){
      if(e.dead||b.hit.has(e.id)) continue;
      const rr=b.r+e.r;
      if(dist2(b.x,b.y,e.x,e.y)<rr*rr){
        b.hit.add(e.id);
        hitEnemy(e, b.dmg*player.dmgMul, b.vx*0.4, b.vy*0.4-15);
        if(--b.pierce<=0){ b.dead=true; break; }
      }
    }
    if(b.life<=0) b.dead=true;
  }
  bullets=bullets.filter(b=>!b.dead);
}

const CELL=16, grid=new Map();
const gkey=(cx,cy)=>cx+','+cy;
function updateEnemies(dt){
  grid.clear();
  for(const e of enemies){
    const k=gkey((e.x/CELL)|0,(e.y/CELL)|0);
    let a=grid.get(k); if(!a){a=[];grid.set(k,a);} a.push(e);
  }
  for(const e of enemies){
    if(e.dead) continue;
    e.flash-=dt; e.orbCd-=dt; e.animT+=dt;
    if(e.animT>e.anim){ e.animT=0; e.animF^=1; }
    // 朝向玩家
    const dx=player.x-e.x, dy=player.y-e.y;
    let vx=dx, vy=dy;
    const d=Math.sqrt(dx*dx+dy*dy)||1;
    vx/=d; vy/=d;
    if(e.ghost){ const s=Math.sin(time*3+e.seed)*0.6; const px=-vy*s, py=vx*s; vx+=px; vy+=py; }
    e.x+=(vx*e.spd+e.kx)*dt;
    e.y+=(vy*e.spd+e.ky)*dt;
    e.kx*=Math.pow(0.001,dt); e.ky*=Math.pow(0.001,dt);
    // 拥挤分离
    const cx=(e.x/CELL)|0, cy=(e.y/CELL)|0;
    for(let gx=-1;gx<=1;gx++)for(let gy=-1;gy<=1;gy++){
      const a=grid.get(gkey(cx+gx,cy+gy)); if(!a) continue;
      for(const o of a){
        if(o===e||o.dead) continue;
        const ox=o.x-e.x, oy=o.y-e.y, rr=e.r+o.r;
        const d2=ox*ox+oy*oy;
        if(d2>0.0001&&d2<rr*rr){
          const dd=Math.sqrt(d2), push=(rr-dd)/dd*0.22;
          e.x-=ox*push; e.y-=oy*push;
        }
      }
    }
    // 碰撞玩家
    const pr=e.r+4;
    if(player.invuln<=0 && dist2(e.x,e.y,player.x,player.y)<pr*pr)
      hurtPlayer(e.dmg-player.armor);
    // 太远清理
    if(dist2(e.x,e.y,player.x,player.y)>640*640) e.dead=true;
  }
  enemies=enemies.filter(e=>!e.dead);
}
function hurtPlayer(d){
  d=Math.max(1,Math.round(d));
  player.hp-=d; player.invuln=0.8; hurtT=0.3; shake=Math.max(shake,3);
  sfx('hurt');
  addFloat(player.x,player.y-10,'-'+d,'#e04545',8);
  if(player.hp<=0){ player.hp=0; saveBest(); state='over'; overT=0; sfx('boss'); }
}

function updateGems(dt){
  for(const g of gems){
    g.t+=dt;
    const d2p=dist2(g.x,g.y,player.x,player.y);
    if(g.pull || d2p<player.pickupR*player.pickupR){
      const d=Math.sqrt(d2p)||1;
      g.x+=(player.x-g.x)/d*270*dt;
      g.y+=(player.y-g.y)/d*270*dt;
    }
    if(d2p<100){ g.dead=true; gainXP(g.v); }
  }
  gems=gems.filter(g=>!g.dead);
}
function updatePickups(dt){
  for(const p of pickups){
    if(dist2(p.x,p.y,player.x,player.y)>12*12) continue;
    p.dead=true;
    if(p.kind==='chicken'){ player.hp=Math.min(player.maxHp,player.hp+30); sfx('heal'); addFloat(player.x,player.y-10,'+30','#4dbf6b',8); }
    else if(p.kind==='magnet'){ for(const g of gems) g.pull=true; sfx('chest'); addFloat(player.x,player.y-10,'磁力全收!','#6fe3ff',8); }
    else if(p.kind==='chest'){
      const ups=player.weapons.filter(w=>w.lvl<WEAPONS[w.key].max);
      if(ups.length){
        const w=pick(ups); w.lvl++;
        addFloat(player.x,player.y-12,WEAPONS[w.key].name+' 升级!','#f2c14e',9);
      }else{ gainXP(20); addFloat(player.x,player.y-12,'宝物!','#f2c14e',9); }
      player.hp=Math.min(player.maxHp,player.hp+25);
      sfx('chest'); shake=Math.max(shake,2);
      for(let i=0;i<12;i++) parts.push({x:p.x,y:p.y,vx:rand(-60,60),vy:rand(-90,-10),life:rand(0.3,0.7),color:'#f2c14e',size:2});
    }
  }
  pickups=pickups.filter(p=>!p.dead);
}
function updateFx(dt){
  for(const p of parts){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=120*dt; p.life-=dt; }
  parts=parts.filter(p=>p.life>0);
  for(const f of floats){ f.y+=f.vy*dt; if(!f.big)f.vy*=Math.pow(0.05,dt); f.life-=dt; }
  floats=floats.filter(f=>f.life>0);
  for(const f of fxs) f.life-=dt;
  fxs=fxs.filter(f=>f.life>0);
}

function step(dt){
  time+=dt;
  if(!endless && time>=WIN_TIME){ saveBest(); state='win'; sfx('level'); return; }
  director(dt);
  updatePlayer(dt);
  updateWeapons(dt);
  updateBullets(dt);
  updateEnemies(dt);
  updateGems(dt);
  updatePickups(dt);
  updateFx(dt);
  shake*=Math.pow(0.0005,dt);
  hurtT-=dt;
  if(pendingLv>0) openLevelUp();
}

/* ================= 渲染 ================= */
function renderWorld(){
  const sx=(Math.random()*2-1)*shake, sy=(Math.random()*2-1)*shake;
  camX=player.x-W/2+sx; camY=player.y-H/2+sy;
  // 地面
  const ox=((camX%TILE)+TILE)%TILE, oy=((camY%TILE)+TILE)%TILE;
  for(let x=-ox;x<W;x+=TILE)for(let y=-oy;y<H;y+=TILE) ctx.drawImage(bgTile,Math.round(x),Math.round(y));
  const wx=x=>x-camX, wy=y=>y-camY;
  // 大蒜光环
  const gw=player.weapons.find(w=>w.key==='garlic');
  if(gw){
    const r=WEAPONS.garlic.st(gw.lvl).rad+Math.sin(time*5)*1.5;
    ctx.fillStyle='rgba(200,230,180,0.07)';
    ctx.beginPath(); ctx.arc(Math.round(wx(player.x)),Math.round(wy(player.y)),r,0,7); ctx.fill();
    ctx.strokeStyle='rgba(200,235,190,0.35)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(Math.round(wx(player.x)),Math.round(wy(player.y)),r,0,7); ctx.stroke();
  }
  // 宝石与掉落
  for(const g of gems){
    const spr=g.v>=8?SPR.gemL:(g.v>=3?SPR.gemM:SPR.gemS);
    drawSpr(spr,wx(g.x),wy(g.y)+Math.sin(g.t*4)*1);
  }
  for(const p of pickups){
    const spr=p.kind==='chicken'?SPR.chicken:(p.kind==='magnet'?SPR.magnet:SPR.chest);
    drawSpr(spr,wx(p.x),wy(p.y)-Math.abs(Math.sin(time*3))*2);
  }
  // 敌人（按 y 排序伪景深）
  const sorted=enemies.slice().sort((a,b)=>a.y-b.y);
  for(const e of sorted){
    const spr=SPR[e.spr], ex=wx(e.x), ey=wy(e.y);
    if(ex<-30||ex>W+30||ey<-40||ey>H+40) continue;
    const bob=e.ghost?Math.sin(time*4+e.seed)*1.5:0;
    drawSpr(spr,ex,ey+bob,{flip:e.x>player.x, white:e.flash>0, alpha:e.ghost?0.82:1});
    if(e.hp<e.maxHp){
      const bw=Math.max(7,e.r*2.4);
      ctx.fillStyle='#10131c'; ctx.fillRect(Math.round(ex-bw/2)-1,Math.round(ey-e.half-6),bw+2,3);
      ctx.fillStyle=e.boss?'#e04545':'#7ec850';
      ctx.fillRect(Math.round(ex-bw/2),Math.round(ey-e.half-5),Math.round(bw*clamp(e.hp/e.maxHp,0,1)),1);
    }
  }
  // 玩家
  const ps=player.animF?SPR.playerB:SPR.playerA;
  const blink=player.invuln>0 && Math.floor(time*14)%2===0;
  drawSpr(ps,wx(player.x),wy(player.y),{flip:player.face<0,alpha:blink?0.35:1});
  // 圣典宝珠
  for(const w of player.weapons){
    if(WEAPONS[w.key].mode!=='orbit'||!w.active) continue;
    const st=WEAPONS.bible.st(w.lvl);
    for(let i=0;i<st.count;i++){
      const a=w.ang+i*Math.PI*2/st.count;
      drawSpr(SPR.orb,wx(player.x+Math.cos(a)*30),wy(player.y+Math.sin(a)*30));
    }
  }
  // 子弹
  for(const b of bullets){
    if(b.kind==='wand') drawSpr(SPR.bolt,wx(b.x),wy(b.y),{angle:b.ang});
    else if(b.kind==='axe') drawSpr(SPR.axe,wx(b.x),wy(b.y),{angle:b.spin});
    else drawSpr(SPR.cross,wx(b.x),wy(b.y),{angle:b.spin});
  }
  // 鞭子特效
  for(const f of fxs){
    const k=f.life/f.max;
    ctx.fillStyle='rgba(255,244,214,'+(0.55*k)+')';
    const w=f.w*(1.15-k*0.3);
    ctx.fillRect(Math.round(f.dir>0?f.x-w/2:f.x-w/2),Math.round(f.y-f.h/2),Math.round(w),f.h);
    ctx.fillStyle='rgba(255,255,255,'+(0.85*k)+')';
    ctx.fillRect(Math.round(f.x-w/2*f.dir+f.dir*(f.dir>0?4:-4)*0),Math.round(f.y-1),Math.round(w*0.6),2);
  }
  // 粒子
  for(const p of parts){
    ctx.globalAlpha=clamp(p.life*2.5,0,1);
    ctx.fillStyle=p.color;
    ctx.fillRect(Math.round(wx(p.x)),Math.round(wy(p.y)),p.size,p.size);
  }
  ctx.globalAlpha=1;
  // 飘字
  for(const f of floats){
    ctx.globalAlpha=clamp(f.life*(f.big?1.2:2),0,1);
    txt(f.text,wx(f.x),wy(f.y),{size:f.size,color:f.color,align:'center',bold:!!f.big});
  }
  ctx.globalAlpha=1;
  // 暗角 + 低血红脉冲
  ctx.drawImage(vignette,0,0);
  if(hurtT>0){ ctx.fillStyle='rgba(180,20,30,'+(hurtT*0.9)+')'; ctx.fillRect(0,0,W,H); }
  if(player.hp/player.maxHp<0.3 && state!=='over'){
    ctx.fillStyle='rgba(160,10,20,'+(0.10+0.08*Math.sin(time*6))+')'; ctx.fillRect(0,0,W,H);
  }
}

/* ================= 输入 ================= */
const mouse={x:-99,y:-99};
function toGame(e){
  const r=cv.getBoundingClientRect();
  return {x:(e.clientX-r.left)*W/r.width, y:(e.clientY-r.top)*H/r.height};
}
addEventListener('keydown',e=>{
  initAudio();
  if(e.code==='KeyM'){ muted=!muted; try{localStorage.setItem('pxvs_mute',muted?'1':'0');}catch(_){} return; }
  keys[e.code]=true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  if(state==='menu'){ if(!e.repeat){ startGame(); sfx('sel'); } return; }
  if(state==='play'&&(e.code==='KeyP'||e.code==='Escape')){ state='paused'; return; }
  else if(state==='paused'&&(e.code==='KeyP'||e.code==='Escape')){ state='play'; return; }
  if(state==='levelup'){
    if(e.code==='Digit1')applyChoice(0);
    else if(e.code==='Digit2')applyChoice(1);
    else if(e.code==='Digit3')applyChoice(2);
    else if(e.code==='ArrowLeft'){selIdx=(selIdx+2)%3;sfx('sel');}
    else if(e.code==='ArrowRight'){selIdx=(selIdx+1)%3;sfx('sel');}
    else if(e.code==='Enter'||e.code==='Space')applyChoice(selIdx);
    return;
  }
  if(state==='over'&&(e.code==='KeyR'||e.code==='Enter')){ startGame(); return; }
  if(state==='win'){
    if(e.code==='KeyR'){ startGame(); }
    else if(e.code==='KeyC'){ endless=true; endNext=time+30; state='play'; }
  }
});
addEventListener('keyup',e=>{ keys[e.code]=false; });
addEventListener('blur',()=>{
  if(state==='play') state='paused';
  for(const k in keys) keys[k]=false;
  dpadRelease();
});

cv.addEventListener('pointerdown',e=>{
  initAudio();
  const p=toGame(e); mouse.x=p.x; mouse.y=p.y;
  if(state==='menu'){ startGame(); sfx('sel'); return; }
  if(state==='paused'){ state='play'; return; }
  // 按钮
  for(const b of uiBtns){
    if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){ b.cb(); return; }
  }
  if(state==='play'){ moveTarget={x:p.x+camX,y:p.y+camY}; cv.setPointerCapture(e.pointerId); }
});
cv.addEventListener('pointermove',e=>{
  const p=toGame(e); mouse.x=p.x; mouse.y=p.y;
  if(state==='play'&&moveTarget&&(e.buttons&1)) moveTarget={x:p.x+camX,y:p.y+camY};
});
addEventListener('pointerup',()=>{ moveTarget=null; });

/* ---- 触屏：左下虚拟方向键（支持按住滑动换向，八方向） ---- */
const dpad = document.getElementById('dpad');
const DIRKEYS = {up:'KeyW', down:'KeyS', left:'KeyA', right:'KeyD'};
const dpadOn = {up:false, down:false, left:false, right:false};
let dpadPointer = null;
if(TOUCH) dpad.classList.add('show');
addEventListener('touchstart', ()=>dpad.classList.add('show'), {once:true, passive:true});
function dpadApply(dx,dy){
  const dz=10;
  const want={up:false,down:false,left:false,right:false};
  if(Math.abs(dx)>dz || Math.abs(dy)>dz){
    if(dy<-dz) want.up=true;
    if(dy> dz) want.down=true;
    if(dx<-dz) want.left=true;
    if(dx> dz) want.right=true;
  }
  let any=false;
  for(const d in want){
    if(dpadOn[d]!==want[d]){
      dpadOn[d]=want[d];
      keys[DIRKEYS[d]]=want[d];
      dpad.querySelector('.'+d).classList.toggle('on',want[d]);
    }
    if(want[d]) any=true;
  }
  dpad.classList.toggle('live',any);
}
function dpadRelease(){ dpadApply(0,0); dpadPointer=null; }
dpad.addEventListener('pointerdown',e=>{
  initAudio();
  dpadRelease(); // 多指接管：先清掉上一根手指的方向
  dpadPointer=e.pointerId;
  try{ dpad.setPointerCapture(e.pointerId); }catch(_){}
  const r=dpad.getBoundingClientRect();
  dpadApply(e.clientX-r.left-r.width/2, e.clientY-r.top-r.height/2);
  e.preventDefault();
});
dpad.addEventListener('pointermove',e=>{
  if(dpadPointer!==e.pointerId) return;
  const r=dpad.getBoundingClientRect();
  dpadApply(e.clientX-r.left-r.width/2, e.clientY-r.top-r.height/2);
});
dpad.addEventListener('pointerup',    e=>{ if(dpadPointer===e.pointerId) dpadRelease(); });
dpad.addEventListener('pointercancel',e=>{ if(dpadPointer===e.pointerId) dpadRelease(); });
dpad.addEventListener('contextmenu',e=>e.preventDefault());

  else if(state==='paused') state='play';
});
btnMute.addEventListener('pointerdown',e=>{
  e.preventDefault(); initAudio();
  muted=!muted;
  try{ localStorage.setItem('pxvs_mute',muted?'1':'0'); }catch(_){}
});

/* ================= 主循环 ================= */
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-last)/1000; last=now;
  if(dt>0.05)dt=0.05;
  if(state==='play') step(dt);
  else if(state==='menu') menuT+=dt;
  else if(state==='over') overT+=dt;
  syncMini();
  render();
}

/* 调试钩子（不影响游戏） */
window.__vs={
  get state(){return state;}, get time(){return time;}, get kills(){return kills;},
  get enemies(){return enemies.length;}, start:startGame,
  get pos(){return {x:Math.round(player.x),y:Math.round(player.y)};},
  grantXP:v=>gainXP(v||10),
  warp:t=>{time=t;}, hurt:d=>hurtPlayer(d||50),
  tick:n=>{for(let i=0;i<(n||1);i++)step(1/60);},
};

buildAllSprites(); buildBg(); buildVignette();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
